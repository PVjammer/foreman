# Generated by `foreman setup-herdr`; re-running it rewrites this file.
id = "foreman"
name = "foreman"
version = "0.3.0"
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

# When herdr starts (including plain `herdr`), start a watcher for every open project.
[[startup]]
command = ["{{.Exe}}", "hook", "startup"]

# A project's space opened: start its watcher.
[[events]]
on = "workspace.created"
command = ["{{.Exe}}", "hook", "event"]

# A space closed: wake its watcher so it notices and exits.
[[events]]
on = "workspace.closed"
command = ["{{.Exe}}", "hook", "event"]

# An agent changed state: wake that project's watcher (or start it) right away.
[[events]]
on = "pane.agent_status_changed"
command = ["{{.Exe}}", "hook", "event"]
